# Test configuration. Inherits everything from application.conf.
#
# Integration tests start an embedded nats-server on a dynamically chosen
# port, so the concrete `nats.url` cannot be fixed here. Each test overrides
# `nats.url` at runtime (e.g. via TestKit.Settings#withAdditionalConfig or by
# passing NatsConnectionSettings built from the embedded server's URL).
include "application.conf"
