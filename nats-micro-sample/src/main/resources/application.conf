# Service configuration.
#
# The `nats` block configures the connection used by the NATS micro-service
# endpoint library (blog.kevinhoffman.akka.nats). Every value supports an
# environment-variable override via the HOCON `${?ENV}` syntax so that
# credentials are never hard-coded.
nats {
  # NATS server URL. Override with the NATS_URL environment variable.
  url = "nats://localhost:4222"
  url = ${?NATS_URL}

  # Optional token authentication. Absent unless NATS_TOKEN is set.
  token = ${?NATS_TOKEN}

  # Optional path to an NKey/JWT credentials (.creds) file.
  # Absent unless NATS_CREDS is set.
  credentials-file = ${?NATS_CREDS}

  # Enable TLS when connecting to the NATS server.
  tls-enabled = false
  tls-enabled = ${?NATS_TLS_ENABLED}

  # Maximum time to drain in-flight requests during shutdown.
  drain-timeout = 5s
}
